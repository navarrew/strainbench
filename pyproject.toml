[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "strainbench"
version = "0.0.1"
description = "A pan-genome analysis workbench for bacterial genomes, with a portable SQLite backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Navarre Lab" }]
keywords = ["bioinformatics", "pangenome", "bacterial-genomics", "mmseqs2", "clustering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Keep the core install light. Heavier deps go in optional groups.
dependencies = []

[project.optional-dependencies]
producer = [
    "biopython>=1.83",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "xlsxwriter>=3.2",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "openpyxl",  # used by tests to read back exported xlsx files
]

[project.scripts]
strainbench = "strainbench.cli.main:main"

[project.urls]
Homepage = "https://github.com/navarrew/strainbench"
Source = "https://github.com/navarrew/strainbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"strainbench.core" = ["schema.sql"]
"strainbench.producer" = ["data/*.tsv", "templates/*.sh", "templates/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
